# Render Blueprint for Klientflo.
# In Render: New + → Blueprint → connect this repo. Render reads this file to
# provision a managed PostgreSQL database (paid plan — Render allows only one
# free DB per account) and a Next.js web service, wiring DATABASE_URL
# automatically. Secrets marked `sync: false` are filled in the dashboard; the
# app runs in demo mode until you add them.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: klientflo-v2-db
    plan: basic-256mb
    region: frankfurt
    databaseName: klientflo_v2
    user: klientflo_v2

services:
  - type: web
    name: klientflo-v2
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /login
    # --prod=false installs dev tooling (prisma, typescript, tailwind) for the
    # build; postinstall runs `prisma generate`.
    buildCommand: pnpm install --prod=false && pnpm build
    # Migrations + seed run at start (only the runtime network reaches the DB's
    # internal hostname). Both are idempotent: migrate deploy no-ops when up to
    # date, and the seed creates the agent + demo data only on a fresh DB. The
    # seed is guarded so a hiccup can't take the service down.
    startCommand: pnpm prisma migrate deploy && (pnpm db:seed || echo "seed skipped") && pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Wired automatically from the managed database above.
      - key: DATABASE_URL
        fromDatabase:
          name: klientflo-v2-db
          property: connectionString
      # Session cookie signing secret — generated once by Render.
      - key: AUTH_SECRET
        generateValue: true

      # --- Set these in the Render dashboard (Environment tab) ---
      # Login password (defaults to "klientflo" if left unset).
      - key: APP_PASSWORD
        sync: false

      # AI — Anthropic Claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false

      # Voice — speech-to-text
      - key: SPEECH_TO_TEXT_PROVIDER
        sync: false
      - key: SPEECH_TO_TEXT_API_KEY
        sync: false

      # WhatsApp Business Cloud API
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

      # Storage — AWS S3 (documents persist here; local disk is ephemeral on Render)
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

      # Property portals
      - key: BROKER_NUMBER
        sync: false

      # Public app URL (set to your Render URL after the first deploy)
      - key: NEXT_PUBLIC_APP_URL
        sync: false
